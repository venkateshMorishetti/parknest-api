# Local PostgreSQL for development and tests:  docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: parknest
      POSTGRES_PASSWORD: parknest
      POSTGRES_DB: parknest_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  pgdata:
